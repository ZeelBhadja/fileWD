<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        body{

            background-image: url(./image_2.jpg);

        a {

        }

        .img_marquee {

        }

        marquee{

        }

        .lower {
            
            margin: 0%;
            padding: 0%;
            display: flex;
            justify-content: space-around;
            background-color: white;
        }
    </style>
</head>

<body>
